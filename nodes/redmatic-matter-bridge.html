<script type="text/javascript">
    RED.nodes.registerType('redmatic-matter-bridge', {
        category: 'config',
        defaults: {
            name: {value: 'RedMatic Bridge', required: true},
            bridgeId: {value: '', required: true, validate: function (val) {
                    return /^[A-Za-z0-9._-]{1,32}$/.test(String(val));
                }
            },
            port: {value: 5540, required: true, validate: function (val) {
                    return RED.validators.number(val) && val >= 1024 && val <= 65535;
                }
            },
            passcode: {value: '', required: true, validate: function (val) {
                    const n = Number(val);
                    const invalid = [0, 11111111, 22222222, 33333333, 44444444, 55555555, 66666666, 77777777, 88888888, 99999999, 12345678, 87654321];
                    return Number.isInteger(n) && n >= 1 && n <= 99999998 && !invalid.includes(n);
                }
            },
            discriminator: {value: '', required: true, validate: function (val) {
                    const n = Number(val);
                    return Number.isInteger(n) && n >= 0 && n <= 4095;
                }
            },
            ipv4: {value: true},
            networkInterface: {value: ''},
            vendorId: {value: ''},
            productId: {value: ''}
        },
        inputs: 0,
        outputs: 0,
        icon: 'matter.svg',
        color: '#4691BA',
        paletteLabel: 'matter bridge',
        align: 'left',
        label() {
            return (this.name ? this.name + ' ' : '') + (this.bridgeId || '') + ':' + this.port;
        },
        labelStyle() {
            return 'node_label_italic';
        },
        oneditprepare() {
            const that = this;
            const vendors = {4937: 'Apple Home', 24582: 'Google Home', 4943: 'Amazon Alexa', 4321: 'Samsung SmartThings', 4997: 'Home Assistant'};

            function escape(text) {
                return $('<div>').text(String(text)).html();
            }

            if (!this.bridgeId || !this.passcode || this.discriminator === '') {
                $.getJSON('redmatic-matter/bridge?suggest=1', data => {
                    if (!that.bridgeId) {
                        $('#node-config-input-bridgeId').val(data.bridgeId);
                    }
                    if (!that.passcode) {
                        $('#node-config-input-passcode').val(data.passcode);
                    }
                    if (that.discriminator === '' || that.discriminator === undefined) {
                        $('#node-config-input-discriminator').val(data.discriminator);
                    }
                });
            }

            $('#matter-advanced-toggle').click(() => {
                $('#matter-advanced').toggle();
                return false;
            });

            function action(name, body, confirmText) {
                if (confirmText && !window.confirm(confirmText)) {
                    return;
                }
                $.ajax({
                    url: 'redmatic-matter/bridge/' + that.id + '/' + name,
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(body || {}),
                    success: render,
                    error: xhr => {
                        let message = xhr.statusText;
                        try {
                            message = JSON.parse(xhr.responseText).error || message;
                        } catch (_e) {}
                        RED.notify('Matter bridge: ' + message, 'error');
                    }
                });
            }

            let lastQr = null;

            function render(info) {
                $('#matter-live').show();
                let status;
                if (info.state === 'error') {
                    status = '<span style="color: #d00">' + escape(info.error) + '</span>';
                } else if (info.state === 'online') {
                    status = info.commissioned ? 'online, paired with ' + info.fabrics.length + ' controller(s)' : 'online, waiting to be paired';
                } else {
                    status = escape(info.state);
                }
                $('#matter-status').html(status + ' &middot; ' + info.endpoints.length + ' endpoints on port ' + info.port);

                if (info.pairingCodes && !info.commissioned) {
                    $('#matter-pairing').show();
                    if (lastQr !== info.pairingCodes.qrPairingCode) {
                        lastQr = info.pairingCodes.qrPairingCode;
                        $('#matter-qrcode').empty();
                        new QRCode(document.getElementById('matter-qrcode'), {text: lastQr, width: 160, height: 160});
                    }
                    $('#matter-manual').text(info.pairingCodes.manualPairingCode.replace(/^(\d{4})(\d{3})(\d{4})$/, '$1-$2-$3'));
                    $('#matter-qrtext').text(lastQr);
                } else {
                    $('#matter-pairing').hide();
                }

                const $fabrics = $('#matter-fabrics').empty();
                if (info.fabrics.length === 0) {
                    $fabrics.append('<tr><td colspan="4"><i>no controllers paired</i></td></tr>');
                }
                info.fabrics.forEach(f => {
                    const vendor = vendors[f.vendorId] || f.vendor;
                    const $row = $('<tr><td>' + f.index + '</td><td>' + escape(vendor) + '</td><td>' + escape(f.label || '') + '</td><td></td></tr>');
                    $('<button class="red-ui-button red-ui-button-small">remove</button>')
                        .click(() => action('removeFabric', {index: f.index}, 'Remove the pairing with ' + vendor + '? The controller will lose this bridge and all its devices.'))
                        .appendTo($row.find('td').last());
                    $fabrics.append($row);
                });
            }

            function poll() {
                if (!that.id || that.id === '_ADD_') {
                    return;
                }
                $.getJSON('redmatic-matter/bridge?config=' + that.id, render).fail(() => {
                    $('#matter-live').hide();
                });
            }

            $('#matter-open-window').click(() => {
                action('openCommissioningWindow', {});
                return false;
            });
            $('#matter-factory-reset').click(() => {
                action('factoryReset', {}, 'Factory reset: every pairing is deleted and all controllers have to add the bridge again. Continue?');
                return false;
            });

            poll();
            this.matterPoll = setInterval(poll, 3000);
        },
        oneditsave() {
            clearInterval(this.matterPoll);
        },
        oneditcancel() {
            clearInterval(this.matterPoll);
        }
    });
</script>

            <div class="form-row" style="display: flex; justify-content: center;"><div id="matter-qrcode"></div></div>
            <div class="form-row" style="text-align: center;">
                <div>Kopplungscode: <b id="matter-manual" style="font-size: 1.3em; letter-spacing: 1px;"></b></div>
                <div style="font-size: 0.85em; color: #888;" id="matter-qrtext"></div>
            </div>
        </div>
        <div class="form-row">
            <b>Gekoppelte Controller (Fabrics)</b>
            <table style="width: 100%; margin-top: 4px;">
                <thead><tr><th style="text-align: left">#</th><th style="text-align: left">Controller</th><th style="text-align: left">Label</th><th></th></tr></thead>
                <tbody id="matter-fabrics"></tbody>
            </table>
        </div>
        <div class="form-row">
            <button class="red-ui-button" id="matter-open-window">Kopplungsfenster öffnen</button>
            <button class="red-ui-button" id="matter-factory-reset" style="margin-left: 12px;">Werksreset</button>
        </div>
    </div>
</script>

<script type="text/x-red" data-help-name="redmatic-matter-bridge">
    <p>Konfigurationsknoten für eine Matter-Bridge. Alle Endpunkte der Nodes, die diese Bridge verwenden, erscheinen
    in Apple Home, Alexa, Google Home oder Home Assistant hinter dieser Bridge.</p>
    <h3>Einstellungen</h3>
    <dl class="message-properties">
        <dt>Name</dt><dd>Angekündigter Name der Bridge.</dd>
        <dt>Bridge-ID</dt><dd>Eindeutige Kennung (wird vorgeschlagen). Sie benennt das Verzeichnis
            <code>&lt;userDir&gt;/matter/&lt;Bridge-ID&gt;</code> mit den Kopplungen und Endpunktnummern.
            <b>Nach dem Koppeln nicht mehr ändern</b> – sonst muss die Bridge in allen Controllern neu hinzugefügt
            werden und Räume, Szenen und Automationen gehen verloren. Eine gelöschte Bridge, die mit derselben ID neu
            angelegt wird, erhält ihre Kopplungen zurück.</dd>
        <dt>Port</dt><dd>UDP-Port der Bridge, Standard 5540. Jede Bridge braucht einen eigenen Port.
            <b>Alexa findet nur Bridges auf Port 5540</b>, also pro Host nur eine Bridge für Alexa.</dd>
        <dt>Passcode</dt><dd>Achtstelliger Kopplungscode (wird vorgeschlagen; zu regelmäßige Codes wie 12345678
            sind laut Matter-Spezifikation ungültig).</dd>
        <dt>Discriminator</dt><dd>12-Bit-Zahl (0–4095), mit der Controller die Bridge beim Koppeln
            unterscheiden (wird vorgeschlagen).</dd>
        <dt>mDNS über IPv4</dt><dd>Standard an. Läuft auf dem Host ein <code>avahi-daemon</code>, erreicht IPv4-Multicast
            manchmal nur einen Responder; dann hilft das Abschalten (Matter braucht ohnehin IPv6). Gilt für alle
            Bridges dieses Node-RED, die erste zählt.</dd>
        <dt>Interface</dt><dd>mDNS nur auf diesem Netzwerkinterface (leer = alle). Gilt ebenfalls prozessweit.</dd>
        <dt>Vendor-/Product-ID</dt><dd>Nur ändern, wenn man weiß, warum. Standard ist die Test-Vendor-ID 0xFFF1,
            die alle Controller für nicht zertifizierte Geräte akzeptieren.</dd>
    </dl>
    <h3>Koppeln</h3>
    <p>Nach dem Deploy zeigt dieser Dialog den QR-Code und den Kopplungscode, solange noch kein Controller gekoppelt
    ist. In der Home-App <i>Gerät hinzufügen</i> wählen und den Code scannen; der Kopplungscode steht auch im
    Node-RED-Log. Die Bridge geht erst online, wenn alle Nodes ihre Endpunkte angemeldet haben (der homematic-Node
    wartet auf die CCU), spätestens nach 90 Sekunden.</p>
    <p><b>Zweiter Controller</b> (z. B. Alexa neben Apple Home): <i>Kopplungsfenster öffnen</i> und den Code im
    zweiten Controller eingeben – oder in der Home-App die Bridge über <i>Für andere Dienste aktivieren</i>
    freigeben. Jede Kopplung erscheint in der Tabelle und lässt sich einzeln entfernen. <i>Werksreset</i> löscht
    alle Kopplungen.</p>
    <h3>Voraussetzungen</h3>
    <p>Matter braucht <b>IPv6</b> im LAN (Link-local genügt) und einen Controller im selben Netzsegment (HomePod,
    Apple TV, Echo, Nest Hub, Home Assistant). Fehlt dem Host eine IPv6-Adresse, zeigt der Node-Status einen
    roten Fehler. UDP 5353 wird mit RedMatic-HomeKit geteilt; die beiden Pakete laufen nebeneinander.</p>
    <h3>Grenzen</h3>
    <p>Apple Home verkraftet etwa 150 Endpunkte je Bridge, Alexa 50. Für mehr Geräte einen weiteren Bridge-Knoten mit
    eigener ID und eigenem Port anlegen. Garagentore und Bewässerung bleiben auf RedMatic-HomeKit, da kein
    Controller die passenden Matter-Gerätetypen darstellt.</p>
</script>
